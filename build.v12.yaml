name: "BingeCat Sync"
guid: "832bd9b3-75aa-4dd7-8477-8d13de65f9ee"
version: "0.2.0.0"
overview: "One-way watched-history sync from Jellyfin to BingeCat."
description: |
  Pairs individual Jellyfin users with BingeCat profiles and sends watched
  history through outbound HTTPS with a durable local outbox.
category: "General"
owner: "BingeCat"
artifacts:
  - "Jellyfin.Plugin.BingeCat.dll"
  - "Microsoft.Data.Sqlite.dll"
  - "SQLitePCLRaw.core.dll"
  - "SQLitePCLRaw.provider.e_sqlite3.dll"
  - "SQLitePCLRaw.batteries_v2.dll"
targetAbi: "12.2.0.0"
framework: "net10.0"
changelog: "Fixes dashboard pairing, keeps Jellyfin running on BingeCat time-outs, skips playback-progress ticks, drops queued events on re-pair and disconnect, and adds a Jellyfin 12 build."
